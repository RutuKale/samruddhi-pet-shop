    function stars(rating, size = "w-4 h-4") {
      let html = "";
      for (let i = 1; i <= 5; i++) {
        const fill =
          rating >= i ? "#df8a55" : rating >= i - 0.5 ? "url(#half)" : "none";
        html += `<svg class="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="#df8a55" stroke-width="1.5">
      <defs><linearGradient id="half"><stop offset="50%" stop-color="#df8a55"/><stop offset="50%" stop-color="transparent"/></linearGradient></defs>
      <path d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.7L12 17.8 5.8 20.6l1.6-6.7L2.2 8.9l6.9-.6z"/></svg>`;
      }
      return `<span class="inline-flex items-center gap-0.5">${html}</span>`;
    }

    function toast(msg, kind = "ok") {
      const colors = {
        ok: "bg-teal-600",
        warn: "bg-clay-500",
        info: "bg-ink dark:bg-cream dark:text-ink",
      };
      const el = document.createElement("div");
      el.className = `glass ${colors[kind]} text-white rounded-2xl px-4 py-3 shadow-lift text-sm font-medium flex items-center gap-2 translate-y-3 opacity-0 transition-all`;
      el.innerHTML = `<span>${kind === "ok" ? "✅" : kind === "warn" ? "💛" : "🐾"}</span><span>${msg}</span>`;
      $("#toasts").appendChild(el);
      requestAnimationFrame(() => {
        el.classList.remove("translate-y-3", "opacity-0");
      });
      setTimeout(() => {
        el.classList.add("opacity-0", "translate-y-3");
        setTimeout(() => el.remove(), 300);
      }, 2600);
    }

    const lazyObserver = new IntersectionObserver(
      (entries, obs) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            const img = e.target;
            if (img.dataset.src) {
              img.src = img.dataset.src;
              img.removeAttribute("data-src");
            }
            img.classList.remove("skel");
            obs.unobserve(img);
          }
        });
      },
      { rootMargin: "200px" },
    );

    const revealObserver = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add("in");
            revealObserver.unobserve(e.target);
          }
        });
      },
      { threshold: 0.12 },
    );

    function hydrateView() {
      $$("#app img[data-src]").forEach((img) => lazyObserver.observe(img));
      $$("#app .reveal").forEach((el) => revealObserver.observe(el));
    }

    <div class="mt-16 reveal">

    function recentlyViewedBlock(excludeId) {
      const items = State.recentlyViewed
        .filter((id) => id !== excludeId)

        .slice(0, 4);

    /* ---------- CART PAGE ---------- */
    function CartPage() {
      if (!State.cart.length) {
        return emptyState(
          "Your cart is empty",

          "Start shopping",

          "🛒",
        );

      const rows = State.cart
        .map((item) => {

          return `<div class="flex flex-col sm:flex-row gap-4 py-5 border-b border-black/10 dark:border-white/10">

      const t = cartTotals();
      return `
  <section class="mx-auto max-w-7xl px-4 py-8">

    <div class="grid lg:grid-cols-[minmax(0,1fr)_360px] gap-6 lg:gap-8">

      ${orderSummary(t, "checkout", "Proceed to checkout")}
    </div>
  </section>`;
    }

    function cartTotals() {
      const sub = State.cart.reduce((s, i) => s + (getCartItemInfo(i)?.price || 0) * i.qty, 0);
      const ship = sub > 49 || sub === 0 ? 0 : 5.99;
      const tax = +(sub * 0.08).toFixed(2);
      return {
        sub: +sub.toFixed(2),
        ship,
        tax,
        total: +(sub + ship + tax).toFixed(2),
      };
    }

    function orderSummary(t, cta, label) {
      return `<aside class="bg-white dark:bg-[#1d1712] rounded-2xl sm:rounded-3xl shadow-soft p-5 sm:p-6 h-fit lg:sticky lg:top-40 space-y-3">

    <div class="flex justify-between text-sm"><span class="text-ink/60 dark:text-cream/60">Subtotal</span><span>${money(t.sub)}</span></div>
    <div class="flex justify-between text-sm"><span class="text-ink/60 dark:text-cream/60">Shipping</span><span>${t.ship === 0 ? "Free" : money(t.ship)}</span></div>
    <div class="flex justify-between text-sm"><span class="text-ink/60 dark:text-cream/60">Estimated tax</span><span>${money(t.tax)}</span></div>
    ${t.sub > 0 && t.sub < 49 ? `<p class="text-xs text-clay-600 dark:text-clay-300">Add ${money(49 - t.sub)} more for free shipping 🚚</p>` : ""}
    <div class="border-t border-black/10 dark:border-white/10 pt-3 flex justify-between font-bold text-lg"><span>Total</span><span>${money(t.total)}</span></div>
    <div class="flex flex-col sm:flex-row gap-2 pt-1">

      <button class="px-4 py-2 rounded-full bg-clay-100 dark:bg-white/10 text-sm font-medium" onclick="window.__toast&&window.__toast('Promo applied — 5% off!')">Apply</button>
    </div>
    <button data-nav="${cta}" class="w-full py-3.5 rounded-full bg-teal-600 text-white font-semibold hover:bg-teal-700 transition mt-2">${label}</button>
    <button data-nav="shop" class="w-full py-2 text-sm text-ink/60 dark:text-cream/60 hover:text-clay-600">Continue shopping</button>

    /* ContactPage is loaded from Contact.js */

    /* AboutPage is loaded from About.js */

    function emptyState(title, sub, cta, route, emoji) {
      return `<section class="mx-auto max-w-xl px-4 py-24 text-center">
    <div class="text-7xl">${emoji}</div>
    <h1 class="font-display text-3xl mt-4">${title}</h1>

    function updateActiveNav() {
      // Update desktop nav
      $$('header nav > a[data-nav]').forEach(el => {
        const on = el.dataset.nav === State.route;
        el.classList.toggle('bg-black/5', on);
        el.classList.toggle('dark:bg-white/10', on);
        el.classList.toggle('text-teal-700', on);
        el.classList.toggle('dark:text-teal-300', on);
        el.classList.toggle('font-semibold', on);
      });
      // Update mobile nav
      const mobileMenu = $("#mobileMenuPanel");
      if (mobileMenu) {
        $$('#mobileNav > a[data-nav]').forEach(el => {
          const on = el.dataset.nav === State.route;
          el.classList.toggle('bg-teal-50', on);
          el.classList.toggle('dark:bg-white/10', on);
          el.classList.toggle('text-teal-800', on);
          el.classList.toggle('dark:text-teal-200', on);
          el.classList.toggle('font-bold', on);
          el.classList.toggle('font-medium', !on);
          el.classList.toggle('text-ink', !on);
          el.classList.toggle('dark:text-cream', !on);

          const iconSpan = el.querySelector("span");
          if (iconSpan) {
            iconSpan.classList.toggle('bg-white', on);
            iconSpan.classList.toggle('dark:bg-[#1a140f]', on);
            iconSpan.classList.toggle('bg-teal-50', !on);
            iconSpan.classList.toggle('dark:bg-teal-900/30', !on);
          }
        });
      }

      // Update auth button
      const authBtnText = $("#authHeaderBtnText");
      if (authBtnText) {
        if (State.isLoggedIn && State.currentUser) {
          authBtnText.textContent = State.currentUser.name.split(" ")[0] || "Profile";
          $("#authHeaderBtn").dataset.nav = "home"; // Direct to home or profile page if created
        } else {
          authBtnText.textContent = "Login";
          $("#authHeaderBtn").dataset.nav = "login";
        }
      }
    }

    /* -------------------------------------------------------------------------
           6. ROUTER
           ------------------------------------------------------------------------- */
    function render(route, opts = {}) {
      if (route === "checkout" && !State.isLoggedIn) {
        toast("Please log in to checkout", "warn");
        State.redirectAfterLogin = "checkout";
        navigate("login", opts, true);
        return;
      }
      if (route === "login" && State.route !== "login" && State.redirectAfterLogin !== "checkout") {
        State.redirectAfterLogin = State.route;
      }
      if (route !== "login" && route !== "checkout") {
        State.redirectAfterLogin = null;
      }
      State.route = route;
      updateActiveNav();
      if (route === "shop" || route === "home") {
        app.innerHTML = `<div class="mx-auto max-w-7xl px-4 py-12">${skeletonGrid(12)}</div>`;
      }

      setTimeout(
        () => {
          let html = "";
          switch (route) {
            case "home":
              html = HomePage();
              break;
            case "shop":
              html = ShopPage();
              break;
            case "product":
              html = ProductPage(opts.id);
              break;
            case "cart":
              html = CartPage();
              break;
            case "wishlist":
              html = WishlistPage();
              break;
            case "login":
              html = LoginPage();
              break;
            case "checkout":
              html = CheckoutPage();
              break;
            case "success":
              html = SuccessPage();
              break;
            case "contact":
              html = ContactPage();
              break;
            case "about":
              html = AboutPage();
              break;
            case "services":
              html = ServicesPage();
              break;
            case "privacypolicy":
              html = PrivacyPolicyPage();
              break;
            case "terms":
              html = TermsPage();
              break;
            case "shipping":
              html = ShippingPage();
              break;
            default:
              html = HomePage();
          }
          app.innerHTML = html;
          window.scrollTo({
            top: 0,
            behavior: "instant" in window ? "instant" : "auto",
          });
          hydrateView();
          if (route === "home") {
            initHero();
            animateCounters();
          }
          if (route === "about") {
            animateCounters();
          }
          if (route === "login") {
            initAuthTabs();
          }
          if (route === "services") {
            if (window.initServicesPage) {
              window.initServicesPage();
            }
          }
          if (opts.scroll) {
            setTimeout(() => {
              const el = $("#" + opts.scroll);
              el && el.scrollIntoView({ behavior: "smooth" });
            }, 120);
          }
        },
        route === "shop" || route === "home" ? 220 : 0,
      );
    }

    const ROUTES = new Set([
      "home",
      "shop",
      "product",
      "cart",
      "wishlist",
      "login",
      "checkout",
      "success",
      "contact",
      "about",
      "services",
      "privacypolicy",
      "terms",
      "shipping"
    ]);

    function routeToUrl(route, opts = {}) {
      const params = new URLSearchParams();
      if (route === "home") {
        const hash = opts.scroll ? `#${encodeURIComponent(opts.scroll)}` : "";
        return `${location.pathname}${hash}`;
      }
      if (route === "product" && opts.id) params.set("id", opts.id);
      if (route === "shop") {
        if (State.shopFilters.pet !== "all")
          params.set("pet", State.shopFilters.pet);
        if (State.shopFilters.category !== "all")
          params.set("category", State.shopFilters.category);
        if (State.shopFilters.brand && State.shopFilters.brand !== "all")
          params.set("brand", State.shopFilters.brand);
        if (State.shopFilters.q) params.set("q", State.shopFilters.q);
        if (State.shopFilters.sort !== "popular")
          params.set("sort", State.shopFilters.sort);
        if (State.shopFilters.page > 1) params.set("page", State.shopFilters.page);
      }
      const query = params.toString();
      return `${location.pathname}#/${route}${query ? `?${query}` : ""}`;
    }

    function routeFromUrl() {
      const raw = location.hash.replace(/^#\/?/, "");
      const [path = "", query = ""] = raw.split("?");
      const route = ROUTES.has(path) ? path : "home";
      const params = new URLSearchParams(query);
      const opts = {};

      if (route === "product") opts.id = params.get("id");
      if (route === "shop") {
        resetShop();
        State.shopFilters.pet = params.get("pet") || "all";
        State.shopFilters.category = params.get("category") || "all";
        State.shopFilters.brand = params.get("brand") || "all";
        State.shopFilters.q = params.get("q") || "";
        State.shopFilters.sort = params.get("sort") || "popular";
        State.shopFilters.page = Math.max(
          1,
          parseInt(params.get("page") || "1", 10),
        );
      }
      if (route === "home" && location.hash && !location.hash.startsWith("#/")) {
        opts.scroll = decodeURIComponent(location.hash.slice(1));
      }
      return { route, opts };
    }

    function navigate(route, opts = {}, replace = false) {
      const url = routeToUrl(route, opts);
      if (`${location.pathname}${location.hash}` !== url) {
        history[replace ? "replaceState" : "pushState"]({ route, opts }, "", url);
      }
      render(route, opts);
    }

    window.addEventListener("popstate", () => {
      const { route, opts } = routeFromUrl();
      render(route, opts);
    });

    /* -------------------------------------------------------------------------
           7. FEATURES
           ------------------------------------------------------------------------- */
    function addToCart(id, qty = 1, variantIdx = 0) {
      const line = State.cart.find((i) => i.id === id && (i.variantIdx === variantIdx || (!i.variantIdx && variantIdx === 0)));
      if (line) line.qty += qty;
      else State.cart.push({ id, qty, variantIdx });
      updateBadges();
      renderCartDrawer();
      const p = byId(id);
      const variant = p && p.variants && p.variants[variantIdx] ? p.variants[variantIdx] : null;
      const nameStr = variant ? `${p.name} (${variant.size})` : (p ? p.name : "");
      toast(`${nameStr} added to cart`);
      bounce("#cartCount");
    }

    function removeFromCart(id, variantIdx = 0) {
      State.cart = State.cart.filter((i) => !(i.id === id && (i.variantIdx === variantIdx || (!i.variantIdx && variantIdx === 0))));
      updateBadges();
      renderCartDrawer();
      if (State.route === "cart") render("cart");
    }

    function changeQty(id, d, variantIdx = 0) {
      const line = State.cart.find((i) => i.id === id && (i.variantIdx === variantIdx || (!i.variantIdx && variantIdx === 0)));
      if (!line) return;
      line.qty += d;
      if (line.qty <= 0) return removeFromCart(id, variantIdx);
      updateBadges();
      renderCartDrawer();
      if (State.route === "cart") render("cart");
    }

    function toggleWish(id) {
      const i = State.wishlist.indexOf(id);
      if (i > -1) {
        State.wishlist.splice(i, 1);
        toast(`${byId(id).name} removed from wishlist`, "warn");
      } else {
        State.wishlist.push(id);
        toast(`${byId(id).name} saved to wishlist`);
        bounce("#wishCount");
      }
      updateBadges();
      $$(`[data-wish="${id}"]`).forEach((btn) => {
        const on = State.wishlist.includes(id);
        btn.classList.toggle("text-clay-500", on);
        const svg = btn.querySelector("svg");
        if (svg) svg.setAttribute("fill", on ? "currentColor" : "none");
      });
      if (State.route === "wishlist") render("wishlist");
    }

    function recordRecentlyViewed(id) {
      State.recentlyViewed = [
        id,
        ...State.recentlyViewed.filter((x) => x !== id),
      ].slice(0, 8);
    }

    function updateBadges() {
      const c = State.cart.reduce((s, i) => s + i.qty, 0);
      const w = State.wishlist.length;
      const cc = $("#cartCount"),
        wc = $("#wishCount");
      cc.textContent = c;
      cc.classList.toggle("hidden", c === 0);
      wc.textContent = w;
      wc.classList.toggle("hidden", w === 0);
    }

      const t = cartTotals();

    <button data-close-cart data-nav="checkout" class="w-full py-3 rounded-full bg-teal-600 text-white font-semibold">Checkout · ${money(t.total)}</button>`;

        <div class="flex gap-2 mt-5">

        </div>

    /* ---------- ENHANCED HERO CAROUSEL with REAL IMAGES ---------- */
    let heroIndex = 0,
      heroTimer = null;

    function initHero() {
      const track = $("#heroTrack"),
        dots = $("#heroDots");
      if (!track) return;

      track.innerHTML = HERO_SLIDES.map(
        (s, i) => `
    <div class="hero-slide ${i === 0 ? "active" : "inactive"}" data-index="${i}">

            <button data-nav="services" class="w-full sm:w-auto px-7 py-3.5 rounded-full text-white bg-teal-700 backdrop-blur font-semibold hover:bg-white hover:text-teal-700 hover:scale-105 transition shadow-lg">Explore services</button>

        (_, i) =>
          `<button data-hero="${i}" class="hero-dot ${i === 0 ? "active" : "inactive"}" aria-label="Slide ${i + 1}"></button>`,
      ).join("");

      heroIndex = 0;

    function showHero(i) {
      const slides = $$(".hero-slide"),
        dots = $$(".hero-dot");
      if (!slides.length) return;
      heroIndex = (i + slides.length) % slides.length;
      slides.forEach((s, idx) => {
        const on = idx === heroIndex;
        s.classList.toggle("active", on);
        s.classList.toggle("inactive", !on);
      });
      dots.forEach((d, idx) => {
        const on = idx === heroIndex;
        d.classList.toggle("active", on);
        d.classList.toggle("inactive", !on);
      });
    }

    function startHero() {
      clearInterval(heroTimer);
      heroTimer = setInterval(() => showHero(heroIndex + 1), 5000);
    }

    /* ---------- COUNTERS ---------- */
    function animateCounters() {
      $$(".counter").forEach((el) => {
        const raw = el.dataset.target;
        const num = parseFloat(raw.replace(/[^0-9.]/g, ""));
        if (isNaN(num)) {
          return;
        }
        const suffix = raw.replace(/[0-9.,]/g, "");
        const prefix = raw.startsWith("₹") ? "₹" : "";
        let cur = 0;
        const step = num / 40;
        const tick = () => {
          cur += step;
          if (cur >= num) {
            el.textContent = raw;
          } else {
            el.textContent =
              prefix + Math.floor(cur).toLocaleString() + suffix.replace("₹", "");
            requestAnimationFrame(tick);
          }
        };
        const io = new IntersectionObserver((e, o) => {
          if (e[0].isIntersecting) {
            tick();
            o.disconnect();
          }
        });
        io.observe(el);
      });
    }

    /* ---------- AUTH TABS ---------- */
    function initAuthTabs() {
      $$(".auth-tab").forEach((t) =>
        t.addEventListener("click", () => {
          const mode = t.dataset.auth,
            reg = mode === "register";
          $$(".auth-tab").forEach((x) => {
            const on = x === t;
            x.classList.toggle("bg-white", on);
            x.classList.toggle("dark:bg-[#2a221c]", on);
            x.classList.toggle("shadow-soft", on);
          });
          $("#nameField").classList.toggle("hidden", !reg);
          $("#authTitle").textContent = reg
            ? "Create your account"
            : "Welcome back";
          $("#authSub").textContent = reg
            ? "Join the pack and start earning paw points."
            : "Log in to track orders and reorder fast.";
          $("#authSubmit").textContent = reg ? "Create account" : "Log in";
        }),
      );
    }

    /* ---------- OVERLAYS ---------- */
    function openOverlay(sel) {
      const o = $(sel);
      o.classList.remove("hidden");
      document.body.style.overflow = "hidden";
      const panel = o.querySelector("#cartPanel,#mobileMenuPanel");
      if (panel) {
        requestAnimationFrame(() =>
          panel.classList.remove("translate-x-full", "translate-x-[-100%]"),
        );
      }
    }

    function closeOverlay(sel) {
      const o = $(sel);
      const panel = o.querySelector("#cartPanel,#mobileMenuPanel");
      if (panel) {
        panel.classList.add(
          sel === "#cartDrawer" ? "translate-x-full" : "translate-x-[-100%]",
        );
        setTimeout(() => {
          o.classList.add("hidden");
        }, 280);
      } else o.classList.add("hidden");
      document.body.style.overflow = "";
    }

    /* -------------------------------------------------------------------------
           8. GLOBAL EVENTS
           ------------------------------------------------------------------------- */
    window.__toast = toast;

    document.addEventListener("click", (e) => {
      const t = e.target.closest(
        "[data-nav],[data-add],[data-add-qty],[data-add-bundle],[data-wish],[data-quick],[data-remove],[data-inc],[data-dec],[data-filter],[data-page],[data-slide],[data-gallery],[data-hero],[data-book],[data-scroll],[data-close-cart],[data-close-quick],[data-close-menu],.variant-pill",
      );
      if (!t) return;

      if (t.classList.contains("variant-pill")) {
        const idx = parseInt(t.dataset.variantIdx, 10);
        const pid = t.dataset.productId;
        const p = byId(pid);
        if (p && p.variants && p.variants[idx]) {
          const selectedVar = p.variants[idx];
          const gridWrapper = t.closest(".grid") || t.closest("section");
          // Update main gallery image
          const galleryMain = $("#galleryMain") || gridWrapper.querySelector("img");
          if (galleryMain) galleryMain.src = selectedVar.imageUrl;

          // Update price display
          const priceDisplay = gridWrapper.querySelector(".price-value");
          if (priceDisplay) priceDisplay.textContent = money(selectedVar.price);

          // Update active styling of variant pills
          t.parentElement.querySelectorAll(".variant-pill").forEach(el => {
            el.classList.remove("border-teal-600", "bg-teal-50", "text-teal-800", "dark:bg-teal-900/30", "dark:text-teal-300");
            el.classList.add("border-black/10", "dark:border-white/10", "text-ink/70", "dark:text-cream/70");
          });
          t.classList.add("border-teal-600", "bg-teal-50", "text-teal-800", "dark:bg-teal-900/30", "dark:text-teal-300");
          t.classList.remove("border-black/10", "dark:border-white/10", "text-ink/70", "dark:text-cream/70");

          // Update active styling of thumbnails
          $$(".thumb").forEach((th) => {
            const isMatch = th.dataset.gallery === selectedVar.imageUrl;
            th.classList.toggle("ring-teal-600", isMatch);
            th.classList.toggle("ring-transparent", !isMatch);
          });
        }
        return;
      }

      if (t.hasAttribute("data-nav")) {
        const route = t.dataset.nav;
        if (route === "__placeorder") {
          e.preventDefault();
          const form = $("#checkoutForm");
          if (form && !form.checkValidity()) {
            form.reportValidity();
            return;
          }
          placeOrder();
          return;
        }
        if (route === "cookies") {
          e.preventDefault();
          closeAll();
          setTimeout(() => {
            openCookiesPopup();
          }, 300); // Wait for offcanvas to animate out if clicked from mobile
          return;
        }
        e.preventDefault();
        const opts = {};
        if (t.dataset.id) opts.id = t.dataset.id;
        if (t.dataset.scroll) opts.scroll = t.dataset.scroll;
        if (t.dataset.shopPet) {
          resetShop();
          State.shopFilters.pet = t.dataset.shopPet;
          navigate("shop");
          closeAll();
          return;
        }
        if (t.dataset.shopCat) {
          resetShop();
          State.shopFilters.category = t.dataset.shopCat;
          navigate("shop");
          closeAll();
          return;
        }
        if (t.dataset.shopBrand) {
          resetShop();
          State.shopFilters.brand = t.dataset.shopBrand;
          navigate("shop");
          closeAll();
          return;
        }
        navigate(route, opts);
        closeAll();
        return;
      }
      if (t.dataset.add) {
        const gridWrapper = t.closest(".grid") || t.closest("article");
        const activePill = gridWrapper ? gridWrapper.querySelector(".variant-pill.border-teal-600") : null;
        const idx = activePill ? parseInt(activePill.dataset.variantIdx, 10) : 0;
        addToCart(t.dataset.add, 1, idx);
        return;
      }
      if (t.dataset.addQty) {
        const q = parseInt($("#qtyVal")?.textContent || "1", 10);
        const gridWrapper = t.closest("section") || t.closest(".grid");
        const activePill = gridWrapper ? gridWrapper.querySelector(".variant-pill.border-teal-600") : null;
        const idx = activePill ? parseInt(activePill.dataset.variantIdx, 10) : 0;
        addToCart(t.dataset.addQty, q, idx);
        return;
      }
      if (t.dataset.addBundle) {
        t.dataset.addBundle.split(",").forEach((id) => addToCart(id, 1, 0));
        return;
      }
      if (t.dataset.wish) {
        toggleWish(t.dataset.wish);
        return;
      }
      if (t.dataset.quick) {
        openQuick(t.dataset.quick);
        return;
      }
      if (t.dataset.remove) {
        const vIdx = t.dataset.variantIdx !== undefined ? parseInt(t.dataset.variantIdx, 10) : 0;
        removeFromCart(t.dataset.remove, vIdx);
        return;
      }
      if (t.dataset.inc) {
        const vIdx = t.dataset.variantIdx !== undefined ? parseInt(t.dataset.variantIdx, 10) : 0;
        changeQty(t.dataset.inc, 1, vIdx);
        return;
      }
      if (t.dataset.dec) {
        const vIdx = t.dataset.variantIdx !== undefined ? parseInt(t.dataset.variantIdx, 10) : 0;
        changeQty(t.dataset.dec, -1, vIdx);
        return;
      }
      if (t.dataset.filter) {
        const [key, val] = t.dataset.filter.split(":");
        if (key === "reset") {
          resetShop();
        } else {
          State.shopFilters[key] = val;
          State.shopFilters.page = 1;
        }
        navigate("shop");
        return;
      }
      if (t.dataset.page) {
        State.shopFilters.page = parseInt(t.dataset.page, 10);
        navigate("shop");
        $("#app").scrollIntoView({ behavior: "smooth" });
        return;
      }
      if (t.dataset.slide) {
        const [sel, dir] = t.dataset.slide.split(":");
        const el = $("#" + sel);
        if (el)
          el.scrollBy({
            left: parseInt(dir, 10) * Math.min(el.clientWidth * 0.8, 340),
            behavior: "smooth",
          });
        return;
      }
      if (t.dataset.gallery) {
        $("#galleryMain").src = t.dataset.gallery;
        $$(".thumb").forEach((th) =>
          th.classList.toggle(
            "ring-teal-600",
            th.dataset.gallery === t.dataset.gallery,
          ),
        );
        $$(".thumb").forEach((th) =>
          th.classList.toggle(
            "ring-transparent",
            th.dataset.gallery !== t.dataset.gallery,
          ),
        );

        // Working vice versa: find corresponding variant pill for this image and activate it
        const productSec = t.closest("section") || t.closest(".grid") || document;
        const variantPills = productSec.querySelectorAll(".variant-pill");
        let matchedPill = null;
        for (const pill of variantPills) {
          const idx = parseInt(pill.dataset.variantIdx, 10);
          const pid = pill.dataset.productId;
          const p = byId(pid);
          if (p && p.variants && p.variants[idx] && p.variants[idx].imageUrl === t.dataset.gallery) {
            matchedPill = pill;
            break;
          }
        }
        if (matchedPill) {
          const idx = parseInt(matchedPill.dataset.variantIdx, 10);
          const pid = matchedPill.dataset.productId;
          const p = byId(pid);
          const selectedVar = p.variants[idx];
          const gridWrapper = matchedPill.closest(".grid") || matchedPill.closest("section");

          // Update price display
          const priceDisplay = gridWrapper.querySelector(".price-value");
          if (priceDisplay) priceDisplay.textContent = money(selectedVar.price);

          // Update active styling of variant pills
          matchedPill.parentElement.querySelectorAll(".variant-pill").forEach(el => {
            el.classList.remove("border-teal-600", "bg-teal-50", "text-teal-800", "dark:bg-teal-900/30", "dark:text-teal-300");
            el.classList.add("border-black/10", "dark:border-white/10", "text-ink/70", "dark:text-cream/70");
          });
          matchedPill.classList.add("border-teal-600", "bg-teal-50", "text-teal-800", "dark:bg-teal-900/30", "dark:text-teal-300");
          matchedPill.classList.remove("border-black/10", "dark:border-white/10", "text-ink/70", "dark:text-cream/70");
        }
        return;
      }
      if (t.dataset.hero !== undefined) {
        showHero(parseInt(t.dataset.hero, 10));
        startHero();
        return;
      }
      if (t.dataset.book) {
        toast(`${t.dataset.book} — request sent! Our team will confirm shortly.`);
        return;
      }
      if (t.hasAttribute("data-close-cart")) {
        closeOverlay("#cartDrawer");
      }
      if (t.hasAttribute("data-close-quick")) {
        closeOverlay("#quickModal");
      }
      if (t.hasAttribute("data-close-menu")) {
        closeOverlay("#mobileMenu");
      }
    });

    function resetShop() {
      State.shopFilters = {
        pet: "all",
        category: "all",
        brand: "all",
        sort: "popular",
        q: "",
        page: 1,
      };
    }

    function closeAll() {
      ["#mobileMenu", "#cartDrawer", "#quickModal"].forEach((s) => {
        if (!$(s).classList.contains("hidden")) closeOverlay(s);
      });
    }

    function placeOrder() {
      toast("Processing your order…", "info");
      setTimeout(() => {
        State.cart = [];
        updateBadges();
        renderCartDrawer();
        navigate("success");
      }, 900);
    }

    document.addEventListener("change", (e) => {
      if (e.target.id === "sortSelect") {
        State.shopFilters.sort = e.target.value;
        State.shopFilters.page = 1;
        navigate("shop");
      }
    });

    document.addEventListener("submit", (e) => {
      if (e.target.id === "authForm") {
        e.preventDefault();

        const email = $("#authEmail").value.trim();
        const password = $("#authPassword").value.trim();
        const isRegister = !$("#nameField").classList.contains("hidden");

        toast("Processing...", "info");

        if (isRegister) {
          const name = $("#authName").value.trim();

          db.collection("users").where("email", "==", email).get().then(snapshot => {
            if (!snapshot.empty) {
              toast("Email already exists. Please log in.", "warn");
            } else {
              db.collection("users").add({
                name,
                email,
                password,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              }).then(() => {
                State.isLoggedIn = true;
                State.currentUser = { name, email };
                updateActiveNav();
                toast("Account created — welcome to the pack! 🐾");
                setTimeout(() => {
                  let next = State.redirectAfterLogin || "home";
                  if (next === "checkout" && State.cart.length === 0) next = "home";
                  navigate(next);
                }, 700);
              });
            }
          }).catch(err => {
            console.error(err);
            toast("An error occurred.", "warn");
          });
        } else {
          db.collection("users").where("email", "==", email).get().then(snapshot => {
            if (snapshot.empty) {
              toast("User does not exist. Please register first.", "warn");
              const regBtn = document.querySelector('[data-auth="register"]');
              if (regBtn) regBtn.click();
            } else {
              let match = null;
              snapshot.forEach(doc => {
                if (doc.data().password === password) {
                  match = doc.data();
                }
              });
              if (!match) {
                toast("Invalid password.", "warn");
              } else {
                State.isLoggedIn = true;
                State.currentUser = { name: match.name, email: match.email };
                updateActiveNav();
                toast(`Welcome back, ${match.name}! 🐾`);
                setTimeout(() => {
                  let next = State.redirectAfterLogin || "home";
                  if (next === "checkout" && State.cart.length === 0) next = "home";
                  navigate(next);
                }, 700);
              }
            }
          }).catch(err => {
            console.error(err);
            toast("An error occurred.", "warn");
          });
        }
      }
      if (e.target.id === "contactForm") {
        e.preventDefault();
        e.target.reset();
        toast("Message sent! We’ll reply within hours.");
      }
      if (e.target.id === "checkoutForm") {
        e.preventDefault();
        placeOrder();
      }
    });

    document.addEventListener("click", (e) => {
      if (e.target.id === "newsBtn") {
        const email = $("#newsEmail").value.trim();
        if (/^[^@]+@[^@]+\.[^@]+$/.test(email)) {
          $("#newsEmail").value = "";
          toast("Subscribed! Watch your inbox for treats.");
        } else toast("Please enter a valid email", "warn");
      }
    });

    document.addEventListener("click", (e) => {
      if (e.target.id === "qtyPlus" || e.target.id === "qtyMinus") {
        const v = $("#qtyVal");
        let n = parseInt(v.textContent, 10);
        n += e.target.id === "qtyPlus" ? 1 : -1;
        if (n < 1) n = 1;
        v.textContent = n;
      }
    });

    /* ---------- SEARCH ---------- */
    function runSearchSuggest(q) {
      const box = $("#searchSuggest");
      if (!q.trim()) {
        box.classList.add("hidden");
        return;
      }
      const res = PRODUCTS.filter((p) =>
        (p.name + p.brand + p.category).toLowerCase().includes(q.toLowerCase()),
      ).slice(0, 6);
      if (!res.length) {
        box.innerHTML = `<p class="px-3 py-3 text-sm text-ink/50">No products match “${q}”.</p>`;
        box.classList.remove("hidden");
        return;
      }
      box.innerHTML = res
        .map(
          (p) =>
            `<button data-nav="product" data-id="${p.id}" class="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-clay-50 dark:hover:bg-white/5 text-left">
    <img src="${p.image}" class="w-10 h-10 rounded-lg object-contain bg-clay-50/50 dark:bg-black/20 p-0.5" alt=""/>
    <span class="flex-1"><span class="block text-sm font-medium">${p.name}</span><span class="block text-xs text-ink/50">${p.category}</span></span>
    <span class="text-sm font-semibold">${money(p.price)}</span></button>`,
        )
        .join("");
      box.classList.remove("hidden");
    }

    document.addEventListener("input", (e) => {
      if (e.target.id === "searchInput") runSearchSuggest(e.target.value);
    });
    document.addEventListener("keydown", (e) => {
      if (e.target.id === "searchInput" && e.key === "Enter") {
        resetShop();
        State.shopFilters.q = e.target.value;
        navigate("shop");
        $("#searchSuggest").classList.add("hidden");
      }
      if (e.key === "Escape") closeAll();
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#searchSuggest,#searchInput"))
        $("#searchSuggest")?.classList.add("hidden");
    });

    /* -------------------------------------------------------------------------
           9. HEADER BEHAVIOR
           ------------------------------------------------------------------------- */


    window.addEventListener(
      "scroll",
      () => {
        const sc = window.scrollY;
        const header = $("#header");
        if (header) {
          header.classList.toggle("shadow-lift", sc > 10);
          header.classList.toggle("bg-white/70", sc > 10);
          header.classList.toggle("dark:bg-[#1d1712]/70", sc > 10);
          header.classList.toggle("backdrop-blur-md", sc > 10);
          header.classList.toggle("bg-white", sc <= 10);
          header.classList.toggle("dark:bg-[#1d1712]", sc <= 10);
        }
        const bt = $("#backTop");
        if (bt) {
          bt.classList.toggle("opacity-0", sc < 400);
          bt.classList.toggle("pointer-events-none", sc < 400);
        }
      },
      { passive: true }
    );
    $("#backTop")?.addEventListener("click", () =>
      window.scrollTo({ top: 0, behavior: "smooth" })
    );

    $("#cartBtn").addEventListener("click", () => {
      renderCartDrawer();
      openOverlay("#cartDrawer");
    });
    $("#wishlistBtn").addEventListener("click", () => navigate("wishlist"));

    $("#hamburger").addEventListener("click", () => {
      $("#mobileNav").innerHTML = buildMobileNav();
      updateActiveNav();
      openOverlay("#mobileMenu");
      $("#hamburger").setAttribute("aria-expanded", "true");
    });

    function buildMobileNav() {
      const link = (label, attrs, iconHtml) =>
        `<a href="#" ${attrs} class="group flex items-center justify-between px-4 py-3 sm:py-3.5 rounded-[1.25rem] hover:bg-white dark:hover:bg-white/10 hover:shadow-sm transition-all duration-300" data-close-menu>
          <div class="flex items-center gap-4">
            <span class="grid place-items-center w-10 h-10 rounded-full bg-teal-50 dark:bg-teal-900/30 text-teal-600 dark:text-teal-400 shadow-sm group-hover:scale-110 group-active:scale-95 transition-all duration-300">
              ${iconHtml}
            </span>
            <span class="font-semibold text-base inline-block transition-transform duration-300 group-hover:translate-x-1">${label}</span>
          </div>
          <i class="fa-solid fa-chevron-right text-xs opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 text-teal-600 dark:text-teal-400"></i>
        </a>`;

      return `
    <div class="relative mb-5 group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-transform duration-300 group-focus-within:scale-110 group-focus-within:translate-x-0.5">
        <svg class="w-5 h-5 text-ink/40 dark:text-cream/40 group-focus-within:text-teal-600 dark:group-focus-within:text-teal-400 transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <input id="searchInputMobile" type="search" placeholder="Find treats, toys..." class="w-full rounded-2xl bg-white/80 dark:bg-white/5 border border-transparent shadow-sm backdrop-blur-sm pl-11 pr-4 py-3 text-sm outline-none focus:border-teal-500/30 focus:bg-white dark:focus:bg-white/10 focus:ring-4 focus:ring-teal-500/10 transition-all duration-300 hover:shadow-md"/>
    </div>
    
    <div class="space-y-0.5 flex-1 relative z-10">
      ${link('Home', 'data-nav="home"', '<i class="fa-solid fa-house text-sm"></i>')}
      ${link('Shop', 'data-nav="shop"', '<i class="fa-solid fa-shop text-sm"></i>')}
      
      <details class="group/brands overflow-hidden focus:outline-none rounded-[1.25rem] transition-colors duration-300 open:bg-white/50 dark:open:bg-white/5">
        <summary class="flex items-center justify-between px-4 py-3 sm:py-3.5 cursor-pointer list-none hover:bg-white dark:hover:bg-white/10 hover:shadow-sm rounded-[1.25rem] transition-all duration-300 [&::-webkit-details-marker]:hidden focus:outline-none">
          <div class="flex items-center gap-4">
            <span class="grid place-items-center w-10 h-10 rounded-full bg-teal-50 dark:bg-teal-900/30 text-teal-600 dark:text-teal-400 shadow-sm group-hover/brands:scale-110 transition-all duration-300">
              <i class="fa-solid fa-tags text-sm"></i>
            </span>
            <span class="font-semibold text-base text-ink dark:text-cream transition-transform duration-300 group-hover/brands:translate-x-1">All Brands</span>
          </div>
          <svg class="w-5 h-5 text-ink/40 transition-transform duration-300 group-open/brands:rotate-180" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
        </summary>
        <div class="px-4 pb-4 pt-1 animate-fadeUp">
          <div class="grid grid-cols-2 gap-2">
            ${BRANDS.map(b => `<a href="#" data-nav="shop" data-shop-brand="${b}" class="block px-4 py-3 text-sm font-semibold bg-white/80 dark:bg-black/20 border border-transparent rounded-[1rem] hover:bg-white dark:hover:bg-black/40 hover:border-teal-500/30 hover:text-teal-700 dark:hover:text-teal-300 hover:shadow-md hover:-translate-y-0.5 transition-all duration-300 text-center" data-close-menu>${b}</a>`).join("")}
          </div>
        </div>
      </details>

      ${link('Services', 'data-nav="services"', '<i class="fa-solid fa-stethoscope text-sm"></i>')}
      ${link('About us', 'data-nav="about"', '<i class="fa-solid fa-info-circle text-sm"></i>')}
      ${link('Contact us', 'data-nav="contact"', '<i class="fa-solid fa-envelope text-sm"></i>')}
    </div>
    
    <div class="mt-10 mb-4 relative overflow-hidden rounded-[1.75rem] bg-gradient-to-br from-teal-500 to-teal-700 p-8 shadow-xl shadow-teal-900/20 group">
      <div class="absolute -right-4 -top-4 text-white/10 transition-transform duration-700 group-hover:rotate-12 group-hover:scale-110">
        <i class="fa-solid fa-paw text-[8rem]"></i>
      </div>
      <div class="relative z-10">
        <p class="text-white/80 text-[10px] font-bold uppercase tracking-[0.25em] mb-2">Need help?</p>
        <h4 class="text-white font-display text-3xl leading-tight mb-6">Talk to an<br/>expert</h4>
        <a href="tel:+918087426569" class="inline-flex items-center gap-3 bg-white text-teal-800 hover:bg-clay-50 px-6 py-3.5 rounded-full text-sm font-bold shadow-sm transition-transform hover:scale-105 active:scale-95">
          <i class="fa-solid fa-phone"></i>
          080874 26569
        </a>
        <p class="text-sm text-teal-100/90 mt-5 flex items-center gap-2"><i class="fa-solid fa-clock"></i> 9 AM - 9 PM, Daily</p>
      </div>
    </div>`;
    }
    $("#hamburger").addEventListener("click", () =>
      setTimeout(() => {
        const m = $("#searchInputMobile");
        m &&
          m.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") {
              resetShop();
              State.shopFilters.q = m.value;
              navigate("shop");
              closeAll();
            }
          });
      }, 50),
    );

    $("#searchMobileBtn").addEventListener("click", () => {
      $("#hamburger").click();
    });

    /* -------------------------------------------------------------------------
           10. BUILD CHROME & INIT
           ------------------------------------------------------------------------- */
    function buildChrome() {
      $("#catDropdown").innerHTML = BRANDS.map(
        (b) =>
          `<a href="#" data-nav="shop" data-shop-brand="${b}" class="block px-3 py-2 rounded-xl hover:bg-clay-50 dark:hover:bg-white/5 text-sm">${b}</a>`,
      ).join("");
      $("#footerCats").innerHTML = CATEGORIES.slice(0, 6)
        .map(
          (c) =>
            `<li>
              <a class="text-cream/60 hover:text-teal-300 transition-all duration-300 flex items-center group relative" href="#" data-nav="shop" data-shop-cat="${c}">
                <span class="absolute -left-4 w-1.5 h-1.5 rounded-full bg-teal-400 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 shadow-[0_0_8px_rgba(45,212,191,0.6)]"></span>
                <span class="group-hover:translate-x-1 transition-transform duration-300">${c}</span>
              </a>
            </li>`
        )
        .join("");
    }

    function init() {
      buildChrome();
      updateBadges();
      renderCartDrawer();
      const { route, opts } = routeFromUrl();
      navigate(route, opts, true);
      setTimeout(() => {
        const l = $("#pageLoader");
        l.style.opacity = "0";
        l.style.transition = "opacity .4s";
        setTimeout(() => l.remove(), 400);
      }, 600);

      // Fetch brands from database
      db.collection("brands").orderBy("createdAt", "desc").get()
        .then((snapshot) => {
          if (!snapshot.empty) {
            const loadedBrands = [];
            const loadedBrandObjs = [];
            snapshot.forEach((doc) => {
              const data = doc.data();
              if (data.name) {
                loadedBrands.push(data.name);
                loadedBrandObjs.push({ name: data.name, logoUrl: data.logoUrl });
              }
            });
            if (loadedBrands.length > 0) {
              BRANDS = loadedBrands;
              BRAND_OBJS = loadedBrandObjs;
              buildChrome();
              if (State.route === "shop") {
                render("shop");
              } else if (State.route === "home") {
                render("home");
              }
            }
          }
        })
        .catch((error) => {
          console.error("Firestore Error, attempting fallback load:", error);
          db.collection("brands").get()
            .then((snapshot) => {
              if (!snapshot.empty) {
                const loadedBrands = [];
                const loadedBrandObjs = [];
                snapshot.forEach((doc) => {
                  const data = doc.data();
                  if (data.name) {
                    loadedBrands.push(data.name);
                    loadedBrandObjs.push({ name: data.name, logoUrl: data.logoUrl });
                  }
                });
                if (loadedBrands.length > 0) {
                  BRANDS = loadedBrands;
                  BRAND_OBJS = loadedBrandObjs;
                  buildChrome();
                  if (State.route === "shop") {
                    render("shop");
                  } else if (State.route === "home") {
                    render("home");
                  }
                }
              }
            })
            .catch((err) => console.error("Database query failed completely:", err));
        });

      function mapFirestoreProduct(doc) {
        const data = doc.data();
        const variants = data.variants || [];
        const defaultVar = variants[0] || { price: 0, imageUrl: "assets/logo.png", size: "Standard" };
        const tags = [];
        if (data.vetSupport) tags.push("vet");
        if (data.reviews > 1000) tags.push("bestseller");
        const gallery = variants.map(v => v.imageUrl).filter(Boolean);
        if (gallery.length === 0) gallery.push(defaultVar.imageUrl);
        return {
          id: doc.id,
          name: data.name || "Unnamed Product",
          category: data.category || "General",
          subCategory: data.subCategory || "",
          pet: data.pet || "other",
          price: defaultVar.price,
          mrp: defaultVar.price,
          rating: data.rating !== undefined ? data.rating : 5.0,
          reviews: data.reviews !== undefined ? data.reviews : 0,
          brand: data.brand || "Samruddhi",
          tags: tags,
          discount: 0,
          image: defaultVar.imageUrl,
          gallery: gallery,
          desc: data.description || `Premium product curated for your pets.Vet - formulated and ethically sourced.`,
          stock: data.stock !== undefined ? data.stock : 10,
          variants: variants,
          freeShipping: data.freeShipping !== undefined ? data.freeShipping : true,
          returnPolicy: data.returnPolicy !== undefined ? data.returnPolicy : true,
          vetSupport: data.vetSupport !== undefined ? data.vetSupport : false
        };
      }

      // Fetch products from database
      db.collection("products").orderBy("createdAt", "desc").get()
        .then((snapshot) => {
          if (!snapshot.empty) {
            const loadedProducts = [];
            snapshot.forEach((doc) => {
              loadedProducts.push(mapFirestoreProduct(doc));
            });
            if (loadedProducts.length > 0) {
              PRODUCTS = loadedProducts;
              if (State.route === "shop" || State.route === "home" || State.route === "product") {
                const curOpts = routeFromUrl().opts;
                render(State.route, curOpts);
              }
            }
          }
        })
        .catch((error) => {
          console.error("Firestore Products Error, attempting fallback load:", error);
          db.collection("products").get()
            .then((snapshot) => {
              if (!snapshot.empty) {
                const loadedProducts = [];
                snapshot.forEach((doc) => {
                  loadedProducts.push(mapFirestoreProduct(doc));
                });
                if (loadedProducts.length > 0) {
                  PRODUCTS = loadedProducts;
                  if (State.route === "shop" || State.route === "home" || State.route === "product") {
                    const curOpts = routeFromUrl().opts;
                    render(State.route, curOpts);
                  }
                }
              }
            })
            .catch((err) => console.error("Database product query failed completely:", err));
        });
    }
    document.addEventListener("DOMContentLoaded", init);

  </script>
</body>

</html>
